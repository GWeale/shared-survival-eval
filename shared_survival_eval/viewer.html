<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Station episode replay</title>
<style>
:root{color-scheme:dark;--bg:#101718;--panel:#182224;--text:#eff3ef;--muted:#a7b7b5;--line:#344548;--mint:#9fe1bb;--amber:#f2c67e;--bad:#ff9c95;--blue:#a9d4ff;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 24px 64px}header{border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--mint)}h1{font-size:clamp(25px,4vw,38px);line-height:1.15;margin:8px 0 12px;font-weight:650}h2{font-size:17px;font-weight:600;margin:0 0 12px}.muted{color:var(--muted)}.meta{display:flex;gap:8px 20px;flex-wrap:wrap;font-size:14px}.controls{display:flex;gap:14px;align-items:end;flex-wrap:wrap;padding:24px 0}label{font-size:13px;color:var(--muted);display:block}.field{flex:1;min-width:160px}select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 12px}select{display:block;width:100%;margin-top:5px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:enabled{border-color:var(--mint)}:focus-visible{outline:3px solid var(--mint);outline-offset:3px}.nav{display:flex;gap:8px}.station{padding:18px 20px;background:var(--panel);border-radius:var(--radius);margin-bottom:24px}.oxygen-head{display:flex;justify-content:space-between;margin-bottom:10px}.oxygen{height:12px;border-radius:3px;background:#334244;overflow:hidden}.fill{height:100%;background:var(--mint);width:0}.seats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}.seat{border-top:2px solid var(--line);padding:14px 4px}.seat .name{font-size:15px;font-weight:600;overflow-wrap:anywhere}.seat .role{color:var(--muted);font-size:13px;margin:3px 0 12px}.battery{color:var(--amber);font-variant-numeric:tabular-nums}.cargo{font-size:14px;margin-top:8px}.content{display:grid;grid-template-columns:1.25fr 1fr;gap:32px}.entry{padding:12px 0;border-top:1px solid var(--line);font-size:14px}.tag{color:var(--mint);font-size:12px;letter-spacing:.03em}.private{color:var(--amber)}.entry p{margin:5px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:var(--muted);font-size:14px;padding:16px 0}.decision{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:14px;padding:10px 0;border-top:1px solid var(--line)}.warning{color:var(--amber)}footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}details{margin-top:16px}summary{cursor:pointer}pre{max-height:300px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--panel);padding:12px}a{color:var(--blue)}@media(max-width:680px){main{padding:24px 16px 40px}.seats{grid-template-columns:repeat(2,minmax(0,1fr))}.content{grid-template-columns:1fr;gap:24px}.controls{gap:12px}.nav{width:100%}.nav button{flex:1}}
</style>
</head>
<body><main>
<header><div class="eyebrow">Station / episode replay</div><h1 id="title"></h1><div class="meta"><span id="crew"></span><span id="identity" class="muted"></span><span id="status"></span></div></header>
<div class="controls"><div class="field"><label for="view">Viewpoint</label><select id="view"></select></div><div class="field"><label for="frame">Moment</label><select id="frame"></select></div><div class="nav"><button id="prev" aria-label="Previous moment">← Previous</button><button id="next" aria-label="Next moment">Next →</button></div></div>
<section class="station" aria-label="Life support"><div class="oxygen-head"><strong>Shared oxygen</strong><span id="oxygen-label"></span></div><div class="oxygen" role="meter" aria-label="Oxygen" aria-valuemin="0" aria-valuemax="16"><div class="fill" id="oxygen-fill"></div></div></section>
<div class="seats" id="seats"></div>
<div class="content"><section><h2>Conversation so far</h2><div id="messages"></div></section><section><h2 id="actions-title">Submitted decisions</h2><div id="actions"></div><details><summary>Visible observation data</summary><pre id="observation"></pre></details></section></div>
<footer id="footer"></footer>
</main>
<script id="episode" type="application/json">__EPISODE_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById('episode').textContent);
const $=id=>document.getElementById(id);
function add(tag,parent,text,cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;parent.append(node);return node}
const restricted=Number.isInteger(data.restricted_seat);
$('title').textContent=data.eval==='shared'?'Shared survival':'Individual incentives';
$('crew').textContent='Crew: '+data.crew;
$('identity').textContent=restricted?'Seat export · private data redacted':`Seed ${data.seed} · rotation ${data.rotation} · ${data.split}`;
$('status').textContent=data.status==='complete'?(data.result.survived?'Rescued':'Station lost'):'Incomplete episode';
$('status').style.color=data.status==='complete'&&data.result.survived?'var(--mint)':'var(--amber)';
if(!restricted){const option=add('option',$('view'),'All seats · omniscient');option.value='all'}
for(let s=0;s<4;s++){if(restricted&&s!==data.restricted_seat)continue;const option=add('option',$('view'),`Seat ${s} · ${data.assignment[s]}`);option.value=String(s)}
data.frames.forEach((f,i)=>{const option=add('option',$('frame'),`Round ${f.round} · ${f.phase==='discuss'?'before discussion':f.phase==='act'?'before actions':'outcome'}`);option.value=String(i)});
$('footer').textContent=restricted?'This file contains only the selected seat’s observations, decisions and visible events.':'Omniscient file: includes all private observations. Viewpoint filtering is for inspection, not redaction. Export with --seat before sharing a limited view.';
function render(){
const index=Number($('frame').value),frame=data.frames[index],view=$('view').value;
const obs=view==='all'?Object.values(frame.observations)[0]:frame.observations[view];
$('prev').disabled=index===0;$('next').disabled=index===data.frames.length-1;
$('oxygen-label').textContent=`${obs.oxygen} / 16`;$('oxygen-fill').style.width=(obs.oxygen/16*100)+'%';
$('oxygen-fill').style.background=obs.oxygen<=5?'var(--bad)':'var(--mint)';document.querySelector('[role=meter]').setAttribute('aria-valuenow',obs.oxygen);
$('seats').replaceChildren();
for(let s=0;s<4;s++){const el=add('div',$('seats'),'','seat');add('div',el,`Seat ${s}`,'name');add('div',el,data.assignment[s],'role');add('div',el,`${obs.batteries[s]} batteries`,'battery');const own=(view==='all'||Number(view)===s)?frame.observations[String(s)]:null;if(own){add('div',el,`Cargo secured: ${own.private.cargo}`,'cargo');add('div',el,'Values: '+own.private.cargo_values.join(' · '),'cargo');add('div',el,'Sensor: '+(own.private.shock_sensor??'—'),'cargo muted')}else add('div',el,'Private objectives hidden','cargo muted')}
const historyKeys=new Set(Object.values(frame.observations).flatMap(o=>o.history).map(e=>JSON.stringify(e)));
const visible=view==='all'?data.events.filter(e=>historyKeys.has(JSON.stringify(e))):obs.history;
$('messages').replaceChildren();
const messages=visible.filter(e=>e.kind==='message'||e.kind==='commitment');
for(const e of messages){const el=add('div',$('messages'),'','entry');const label=e.kind==='commitment'?'commitment':e.channel==='private'?`private → seat ${e.to}`:'public';add('div',el,`R${e.round} · Seat ${e.seat} · ${label}`,'tag'+(e.channel==='private'?' private':''));add('p',el,e.kind==='commitment'?`Commits to ${e.action}.`:e.text)}
if(!messages.length)add('div',$('messages'),'No visible messages yet.','empty');
$('actions').replaceChildren();
$('actions-title').textContent=frame.phase==='terminal'?'Final outcome':'Submitted decisions · after this observation';
if(frame.phase==='terminal'){add('div',$('actions'),data.result?.survived?'Life support held until rescue.':'Life support failed.','entry');const rewards=data.result?.rewards;if(rewards&&view==='all')rewards.forEach((r,s)=>add('div',$('actions'),`Seat ${s}: ${r.toFixed(3)} reward`,'decision'));else if(data.result)add('div',$('actions'),'Your reward: '+(data.result.own_reward??data.result.rewards?.[Number(view)])?.toFixed(3),'entry')}
else for(const [s,decision] of Object.entries(frame.decisions)){if(view!=='all'&&view!==s)continue;const el=add('div',$('actions'),'','decision');add('strong',el,'Seat '+s);add('span',el,decision?.action??decision?.commit??(frame.phase==='discuss'?'Message submitted':'Invalid response'))}
if(!$('actions').children.length)add('div',$('actions'),data.status==='error'?'Run stopped before decisions completed.':'No decisions visible.','empty');
$('observation').textContent=JSON.stringify(view==='all'?frame.observations:obs,null,2);
document.documentElement.dataset.ready='true';document.documentElement.dataset.frame=String(index);
}
$('view').addEventListener('change',render);$('frame').addEventListener('change',render);
for(const [id,direction] of [['prev',-1],['next',1]])$(id).addEventListener('click',()=>{$('frame').value=String(Number($('frame').value)+direction);render()});
render();
</script></body></html>
