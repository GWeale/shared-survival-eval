[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-survival-eval"
version = "0.2.0"
description = "Evaluate multi-agent cooperation under a common survival and crew-objective reward."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shared-survival-eval = "shared_survival_eval.cli:main"

[tool.setuptools.package-data]
shared_survival_eval = ["viewer.html"]
